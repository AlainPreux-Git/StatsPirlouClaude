name: Mise à jour de la carte Pirlouette

on:
  schedule:
    - cron: "17 5 * * *"      # tous les jours vers 7h (heure de Paris)
  workflow_dispatch:           # bouton « Run workflow » pour forcer une mise à jour
  push:
    branches: [main]
    paths: [build.py, template.html, geocache.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Enregistrer le cache de coordonnées et les données lues
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add geocache.json data.json
          git diff --cached --quiet || (git commit -m "Mise à jour des données du wiki" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
